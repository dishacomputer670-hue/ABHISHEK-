<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Abhishek</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    color:white;
    scroll-behavior:smooth;
    overflow-x:hidden;
    cursor:none; /* hide default cursor */
}

/* CUSTOM CURSOR */
.cursor{
    width:20px;
    height:20px;
    border:2px solid cyan;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999;
    box-shadow:0 0 15px cyan;
}

/* VIDEO BG */
.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:-2;
    overflow:hidden;
}

.video-bg iframe{
    position:absolute;
    top:50%;
    left:50%;
    width:177.77vh;
    height:100vh;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

/* OVERLAY */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* NAV */
nav{
    position:fixed;
    width:100%;
    padding:15px;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    text-align:center;
}

nav a{
    color:#00ffff;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    text-shadow:0 0 10px cyan;
}

/* SECTION */
section{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* NAME */
.title{
    font-size:70px;
    color:red;
    text-shadow:0 0 25px red;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{text-shadow:0 0 50px red;}
}

/* TIME */
#time{
    font-size:45px;
    margin-top:20px;
    color:black;
    background:white;
    padding:5px 15px;
    border-radius:10px;
}

/* DATE */
#date{
    color:black;
    margin-top:5px;
    background:white;
    padding:5px 15px;
    border-radius:10px;
}

/* BUTTON */
.btn{
    margin-top:20px;
    padding:12px 30px;
    border:2px solid red;
    background:transparent;
    color:red;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:red;
    color:white;
    box-shadow:0 0 25px red;
    transform:scale(1.05);
}

/* GAME CARDS */
.game{
    margin:15px;
    padding:20px;
    width:260px;
    background:rgba(0,0,0,0.6);
    border:1px solid cyan;
    border-radius:15px;
    text-align:center;
    transition:0.3s;
}

.game:hover{
    transform:scale(1.1);
    box-shadow:0 0 30px cyan;
}

.game img{
    width:80px;
}

/* CONTACT */
.contact{
    font-size:20px;
    margin:10px;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
<source src="https://www.bensound.com/bensound-music/bensound-dubstep.mp3" type="audio/mp3">
</audio>

<!-- CURSOR -->
<div class="cursor" id="cursor"></div>

<!-- VIDEO -->
<div class="video-bg">
<iframe src="https://www.youtube.com/embed/JBoUwElRFVM?autoplay=1&mute=1&loop=1&playlist=JBoUwElRFVM&controls=0"></iframe>
</div>

<!-- NAV -->
<nav>
<a href="#home">Home</a>
<a href="#gaming">Gaming</a>
<a href="#contact">Contact</a>
</nav>

<!-- HOME -->
<section id="home">

<div class="title">Abhishek</div>

<div id="time"></div>
<div id="date"></div>

<button class="btn" onclick="startAll()">Start</button>

</section>

<!-- GAMING -->
<section id="gaming">

<h2 class="title" style="font-size:40px;">Gaming IDs</h2>

<div class="game">
<img src="https://img.icons8.com/color/96/garena-free-fire.png">
<h3>Free Fire</h3>
<p>lod_abhishek</p>
</div>

<div class="game">
<img src="https://img.icons8.com/color/96/minecraft-logo.png">
<h3>Minecraft</h3>
<p>smarty_piy2589</p>
</div>

</section>

<!-- CONTACT -->
<section id="contact">

<h2 class="title" style="font-size:40px;">Contact</h2>

<div class="contact">Phone: 9834068404</div>
<div class="contact">Email: as9834068404@gmail.com</div>

</section>

<script>

// TIME
function updateTime(){
    let now=new Date();
    document.getElementById("time").innerHTML=now.toLocaleTimeString();
    document.getElementById("date").innerHTML=now.toDateString();
}
setInterval(updateTime,1000);

// START BUTTON (MUSIC + YT)
function startAll(){
    document.getElementById("music").play();
    window.open("https://www.youtube.com/@you_know_abhi","_blank");
}

// CURSOR MOVE
let cursor=document.getElementById("cursor");

document.addEventListener("mousemove",e=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";
});

</script>

</body>
</html>
